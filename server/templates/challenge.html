<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just a moment... | Cloudflare Challenge & Sentinel Gate</title>
  <link rel="stylesheet" href="/static/gauntlet.css">
  <script src="/static/sentinel.js"></script>
  <style>
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .cf-wrapper {
      max-width: 480px;
      width: 90%;
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
    .cf-logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: #f6821f; /* Cloudflare orange */
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .cf-sub {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .turnstile-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 0;
      user-select: none;
    }
    .turnstile-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .turnstile-checkbox {
      width: 28px;
      height: 28px;
      border: 2px solid #64748b;
      border-radius: 6px;
      background: #1e293b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .turnstile-checkbox:hover {
      border-color: #38bdf8;
    }
    .turnstile-checkbox.verified {
      background: #00ff88;
      border-color: #00ff88;
    }
    .turnstile-checkbox.verified::after {
      content: "✔";
      color: #000;
      font-size: 16px;
      font-weight: bold;
    }
    .turnstile-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: #f1f5f9;
      text-align: left;
    }
    .turnstile-brand {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 0.72rem;
      color: #64748b;
    }
    .turnstile-brand span:first-child {
      color: #f6821f;
      font-weight: 700;
      font-size: 0.8rem;
    }
    .cf-footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.6;
    }
    .cf-status {
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="cf-wrapper">
    <div class="cf-logo">Cloudflare</div>
    <h2>Checking your browser before accessing ticket-booker...</h2>
    <div class="cf-sub">This process is automatic. Your browser will redirect shortly.</div>

    <div class="turnstile-box" id="cf-turnstile-wrapper">
      <div class="turnstile-left">
        <div id="cf-checkbox" class="turnstile-checkbox" tabindex="0"></div>
        <div class="turnstile-text">Verify you are human</div>
      </div>
      <div class="turnstile-brand">
        <span>Cloudflare</span>
        <span>Turnstile • Privacy</span>
      </div>
    </div>

    <div id="status-msg" class="cf-status text-cyan">Awaiting human verification...</div>

    <div class="cf-footer">
      Ray ID: <span id="ray-id" class="font-mono">8f2190a4bc819</span> • Performance &amp; security by Cloudflare &amp; Sentinel Fortress WAF
    </div>
  </div>

  <script>
    let challengeData = null;
    const checkbox = document.getElementById("cf-checkbox");
    const statusMsg = document.getElementById("status-msg");

    // Fetch challenge token upon load
    async function initChallenge() {
      try {
        const resp = await fetch("/api/challenge/issue");
        challengeData = await resp.json();
        document.getElementById("ray-id").innerText = challengeData.token.substring(0, 16);
      } catch (e) {
        statusMsg.innerText = "Error loading security challenge";
      }
    }
    initChallenge();

    async function handleVerify() {
      if (!challengeData) return;
      checkbox.classList.add("verified");
      statusMsg.innerText = "⚡ Solving cryptographic Proof-of-Work & verifying telemetry...";

      // 1. Solve PoW in V8
      const powResult = await window.__SENTINEL__.solvePoW(challengeData.token, challengeData.difficulty);

      // 2. Collect environment and trajectory payload
      const payload = window.__SENTINEL__.getPayload();

      // 3. Post to verify endpoint
      try {
        const res = await fetch("/api/challenge/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            pow_token: challengeData.token,
            pow_nonce: powResult.nonce,
            telemetry: payload.telemetry,
            trajectory: payload.trajectory,
            events: payload.events
          })
        });
        const data = await res.json();
        if (data.success) {
          statusMsg.className = "cf-status text-green";
          statusMsg.innerText = "✔ Verification successful! Redirecting to arena...";
          // Set clearance cookie and redirect
          document.cookie = `sentinel_clearance=${data.clearance_token}; path=/; max-age=600`;
          setTimeout(() => {
            window.location.href = "/";
          }, 400);
        } else {
          checkbox.classList.remove("verified");
          statusMsg.className = "cf-status text-danger";
          statusMsg.innerText = `❌ Bot Detected! Score: ${Math.round(data.bot_probability * 100)}% | ${data.anomalies.join(", ")}`;
        }
      } catch (err) {
        statusMsg.innerText = "Verification failed due to network error";
      }
    }

    checkbox.addEventListener("click", handleVerify);
  </script>
</body>
</html>
